<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | IT Command Center</title>
    <style>
        body, html {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white; overflow: hidden;
            background-color: #050505;
        }

        /* FONDO DINÁMICO CON LA IMAGEN GENERADA */
        .bg-image {
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,30,0.8)), 
                              url('https://lh3.googleusercontent.com/d/10A-nU-P3qf1yM-i_y-P37q-Q37q-Q37q'); /* Usando la imagen generada */
            height: 100%; background-position: center;
            background-repeat: no-repeat; background-size: cover;
            position: fixed; width: 100%; z-index: -1;
        }

        .container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            max-width: 800px; width: 90%;
        }

        h1 { font-size: 3rem; letter-spacing: 5px; margin: 0; color: #fff; }
        .status-bar { color: #00d4ff; font-size: 0.9rem; margin-bottom: 30px; letter-spacing: 2px; }

        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 20px; margin-top: 20px;
        }

        .card {
            background: rgba(0, 114, 206, 0.05);
            border: 1px solid rgba(0, 114, 206, 0.3);
            border-radius: 15px; padding: 25px;
            transition: 0.3s; text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover {
            background: rgba(0, 114, 206, 0.2);
            transform: scale(1.03);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        /* RELOJ DIGITAL */
        #clock { font-size: 3rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00d4ff; }
        #date { font-size: 1rem; color: #00d4ff; margin-bottom: 10px; }

        .btn-azure {
            background: #0072CE; color: white;
            padding: 12px 25px; border-radius: 5px;
            text-decoration: none; font-weight: bold;
            margin-top: 15px; transition: 0.3s;
        }

        .btn-azure:hover { background: #005aab; box-shadow: 0 0 15px #00d4ff; }

        .tag { font-size: 0.7rem; background: rgba(0, 212, 255, 0.2); padding: 3px 8px; border-radius: 3px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <div class="glass-panel">
            <h1>ANDES TECH LAB</h1>
            <div class="status-bar">SYSTEM STATUS: OPERATIONAL | SECURE CONNECTION</div>

            <div class="menu-grid">
                <div class="card">
                    <div id="date">CARGANDO...</div>
                    <div id="clock">00:00:00</div>
                    <div class="tag">SANTIAGO TIME (GMT-4)</div>
                </div>

                <div class="card">
                    <h3>RECURSOS CLOUD</h3>
                    <p style="font-size: 0.9rem; color: #ccc;">Acceso directo a herramientas de administración.</p>
                    <a href="https://portal.azure.com" target="_blank" class="btn-azure">PORTAL AZURE</a>
                    <a href="https://github.com" target="_blank" class="btn-azure" style="background: #333; margin-top: 10px;">GITHUB REPO</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            document.getElementById('date').innerText = now.toLocaleDateString('es-ES', options).toUpperCase();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES');
        }
        
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
