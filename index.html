<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | Portal</title>
    <style>
        /* 1. RESET TOTAL */
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 2. EL FONDO: Forzamos que ocupe todo */
        .background-fix {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Usamos tu archivo confirmado Fondo.jpg */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('./Fondo.jpg');
            background-size: cover; /* ESTO ES LO QUE LO ESTIRA */
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* 3. EL CONTENIDO: Flotando encima */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }

        .login-card {
            background: rgba(20, 20, 20, 0.85); /* Fondo oscuro semitransparente */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        h1 { 
            color: white; 
            font-size: 2.2rem;
            letter-spacing: 4px; 
            margin: 0 0 10px 0; 
            text-transform: uppercase;
        }

        p {
            color: #00d4ff;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        .btn-portal {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #00d4ff;
            color: #000;
            text-decoration: none;
            font-weight: 800;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-portal:hover {
            background-color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="background-fix"></div>

    <div class="main-container">
        <div class="login-card">
            <h1>ANDES TECH LAB</h1>
            <p>SISTEMA OPERATIVO ONLINE</p>
            
            <a href="https://portal.azure.com" target="_blank" class="btn-portal">ENTRAR AL PORTAL</a>
        </div>
    </div>

</body>
</html>
