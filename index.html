<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | Command Center</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
            overflow: hidden; 
            background-color: #050505; 
        }

        /* CAPA 1: EL FONDO - Forzamos que se vea */
        .bg-image {
            /* 1. Usamos ./ para asegurar que busque en la raíz del sitio */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,30,0.7)), 
                              url('./Fondo_Pro.jpg'); 
            height: 100vh; 
            width: 100vw;
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover;
            position: fixed; 
            top: 0; 
            left: 0;
            z-index: -1; 
            filter: brightness(0.8);
        }

        .container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            position: relative; 
            z-index: 1; 
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            padding: 45px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 800px; 
            width: 90%;
            text-align: center;
        }

        h1 { font-size: 3rem; letter-spacing: 6px; margin: 0; font-weight: 300; text-transform: uppercase; }
        .status-bar { color: #00d4ff; font-size: 0.8rem; margin-bottom: 35px; font-weight: bold; letter-spacing: 2px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            padding: 30px; 
            transition: 0.4s; 
            text-decoration: none; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .card:hover { 
            background: rgba(0, 212, 255, 0.15); 
            border-color: #00d4ff; 
            transform: translateY(-8px);
        }

        #clock { font-size: 2.8rem; font-weight: bold; font-family: monospace; margin: 5px 0; }
        #date { font-size: 0.9rem; color: #00d4ff; font-weight: bold; }

        .btn-login { 
            background: transparent; 
            border: 2px solid #00d4ff; 
            color: #00d4ff; 
            padding: 12px 25px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 15px; 
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-login:hover { background: #00d4ff; color: #000; box-shadow: 0 0 20px #00d4ff; }
        .tag { font-size: 0.65rem; opacity: 0.7; margin-top: 15px; border: 1px solid rgba(0,212,255,0.4); padding: 3px 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <div class="glass-panel">
            <h1>Andes Tech Lab</h1>
            <div class="status-bar">● SYSTEM OPERATIONAL | SECURE CLOUD NODE</div>

            <div class="menu-grid">
                <div class="card">
                    <div id="date">CARGANDO...</div>
                    <div id="clock">00:00:00</div>
                    <div class="tag">SANTIAGO, CL (LOCAL TIME)</div>
                </div>

                <div class="card">
                    <h3 style="margin:0;">AZURE GATEWAY</h3>
                    <p style="font-size: 0.8rem; color: #ccc; margin: 15px 0;">Acceso directo al portal de administración.</p>
                    <a href="https://portal.azure.com/?whr=andestechlab.onmicrosoft.com" target="_blank" class="btn-login">Iniciar Sesión</a>
                    <div class="tag">SSO / ENTRA ID PROTECTED</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('es-CL', options).toUpperCase();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-CL');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
