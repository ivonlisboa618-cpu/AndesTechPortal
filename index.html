<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | Command Center</title>
    <style>
        body, html {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white; overflow: hidden;
            background-color: #050505;
        }

        /* FONDO PRO: Imagen de Data Center integrada */
        .bg-image {
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,30,0.8)), 
                              url('https://raw.githubusercontent.com/ivonlisboa618-cpu/AndesTechPortal/main/fondo-pro.jpg'); 
            /* Nota: Si no subes la foto, usará un color oscuro elegante por defecto */
            background-color: #0a0a1a;
            height: 100%; background-position: center;
            background-repeat: no-repeat; background-size: cover;
            position: fixed; width: 100%; z-index: -1;
        }

        .container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; padding: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            max-width: 800px; width: 90%;
        }

        h1 { font-size: 3.5rem; letter-spacing: 8px; margin: 0; font-weight: 300; }
        .status-bar { color: #00d4ff; font-size: 0.8rem; margin-bottom: 40px; letter-spacing: 4px; font-weight: bold; }

        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 25px; margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 30px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover {
            background: rgba(0, 114, 206, 0.15);
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        #clock { font-size: 3rem; font-weight: bold; margin: 10px 0; font-family: monospace; }
        #date { font-size: 0.9rem; color: #00d4ff; }

        .btn-login {
            background: transparent; border: 2px solid #00d4ff;
            color: #00d4ff; padding: 12px 30px; border-radius: 5px;
            text-decoration: none; font-weight: bold;
            margin-top: 15px; transition: 0.3s;
        }

        .btn-login:hover { background: #00d4ff; color: #000; box-shadow: 0 0 20px #00d4ff; }

        .tag { font-size: 0.6rem; background: rgba(0, 212, 255, 0.1); padding: 4px 10px; border-radius: 4px; margin-top: 15px; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <div class="glass-panel">
            <h1>ANDES TECH LAB</h1>
            <div class="status-bar">SYSTEM STATUS: <span id="blink">OPERATIONAL</span> | ENTRA ID PROTECTED</div>

            <div class="menu-grid">
                <div class="card">
                    <div id="date">CARGANDO...</div>
                    <div id="clock">00:00:00</div>
                    <div class="tag">SANTIAGO TIME NODE</div>
                </div>

                <div class="card">
                    <h3 style="margin:0">CLOUD ACCESS</h3>
                    <p style="font-size: 0.8rem; color: #aaa; margin: 15px 0;">Autenticación requerida para gestionar recursos.</p>
                    <a href="https://portal.azure.com/signin/index" target="_blank" class="btn-login">LOGIN TO PORTAL</a>
                    <div class="tag">MFA ENABLED</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('es-CL', options).toUpperCase();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-CL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Efecto de parpadeo para el estado
        setInterval(() => {
            const blink = document.getElementById('blink');
            blink.style.opacity = blink.style.opacity == '0' ? '1' : '0';
        }, 800);
    </script>
</body>
</html>
