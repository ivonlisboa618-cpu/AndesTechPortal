<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Andes Tech Lab | Command Center</title>
    <style>
        /* 1. Obligamos al cuerpo a no moverse y ser negro de base */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 2. LA IMAGEN: La estiramos sí o sí a toda la pantalla */
        .fondo-total {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Usamos tu imagen confirmada */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('./Fondo.jpg');
            background-size: cover; /* Esto hace que llene la pantalla */
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1; /* Se va al fondo */
        }

        /* 3. EL CONTENIDO: Flota encima */
        .interfaz {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: white; letter-spacing: 5px; margin: 0 0 20px 0; }

        .btn-azure {
            display: inline-block;
            padding: 15px 30px;
            background: #00d4ff;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-azure:hover { background: white; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="fondo-total"></div>

    <div class="interfaz">
        <div class="panel">
            <img src="./Fondo.jpg" style="width: 100px; border-radius: 50%; margin-bottom: 20px; border: 2px solid #00d4ff;">
            <h1>ANDES TECH LAB</h1>
            <p style="color: #00d4ff; font-weight: bold;">SISTEMA OPERATIVO ONLINE</p>
            <br>
            <a href="https://portal.azure.com" target="_blank" class="btn-azure">ENTRAR AL PORTAL</a>
        </div>
    </div>

</body>
</html>
