<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | IT Command Center</title>
    <style>
        /* 1. RESET Y BASE */
        body, html {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white; overflow: hidden;
            background-color: #050505;
        }

        /* 2. CAPA DE FONDO (LA IMAGEN) */
        .bg-image {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,30,0.7)), 
                              url('./Fondo.jpg'); 
            height: 100vh; width: 100vw;
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover;
            position: fixed; top: 0; left: 0;
            z-index: -1; /* Esto la envía al fondo total */
            filter: brightness(0.8);
        }

        /* 3. CAPA DE CONTENIDO (DELANTE) */
        .container {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; position: relative; z-index: 10;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px; padding: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            max-width: 850px; width: 90%; text-align: center;
        }

        h1 { font-size: 3.5rem; letter-spacing: 8px; margin: 0; font-weight: 300; text-transform: uppercase; }
        .status-bar { color: #00d4ff; font-size: 0.8rem; margin-bottom: 40px; font-weight: bold; letter-spacing: 3px; }

        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 30px; margin-top: 20px;
        }

        /* 4. TARJETAS */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 30px;
            transition: 0.4s ease; text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff; transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        #clock { font-size: 3rem; font-weight: bold; font-family: 'Courier New', monospace; margin: 10px 0; }
        #date { font-size: 0.9rem; color: #00d4ff; font-weight: bold; }

        .btn-login {
            background: transparent; border: 2px solid #00d4ff;
            color: #00d4ff; padding: 12px 30px; border-radius: 6px;
            text-decoration: none; font-weight: bold; margin-top: 20px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-login:hover { background: #00d4ff; color: #000; box-shadow: 0 0 20px #00d4ff; }
        .tag { font-size: 0.6rem; opacity: 0.7; margin-top: 20px; border: 1px solid rgba(0,212,255,0.4); padding: 4px 12px; border-radius: 4px; }
        
        #blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <div class="glass-panel">
            <h1>Andes Tech Lab</h1>
            <div class="status-bar"><span id="blink">●</span> SYSTEM OPERATIONAL | SECURE CLOUD NODE</div>

            <div class="menu-grid">
                <div class="card">
                    <div id="date">CARGANDO...</div>
                    <div id="clock">00:00:00</div>
                    <div class="tag">SANTIAGO, CL (LOCAL TIME)</div>
                </div>

                <div class="card">
                    <h3 style="margin:0; font-weight: 400;">AZURE GATEWAY</h3>
                    <p style="font-size: 0.8rem; color: #ccc; margin: 15px 0;">Acceso directo al portal de administración.</p>
                    <a href="https://portal.azure.com/?whr=andestechlab.onmicrosoft.com" target="_blank" class="btn-login">Iniciar Sesión</a>
                    <div class="tag">SSO / ENTRA ID PROTECTED</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('es-CL', options).toUpperCase();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-CL');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
