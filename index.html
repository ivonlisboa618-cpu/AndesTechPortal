<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andes Tech Lab | IT Command Center</title>
    <style>
        /* 1. RESET Y BASE - Fondo Negro de Seguridad */
        body, html {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; overflow: hidden;
            background-color: #050505;
        }

        /* 2. CAPA DE FONDO: Data Center con URL Absoluta (A prueba de fallos) */
        .bg-image {
            /* **He cambiado la URL aquí por la absoluta de tu repo Raw** */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,30,0.7)), 
                              url('https://raw.githubusercontent.com/AndesTechPortal/AndesTechPortal/main/Fondo.jpg'); 
            height: 100vh; width: 100vw;
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover;
            position: fixed; top: 0; left: 0;
            z-index: -1;
            filter: brightness(0.8);
        }

        /* 3. CAPA DE CONTENIDO: Flotando encima */
        .container {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; position: relative; z-index: 10;
        }

        /* 4. BANNER ANDESTECH EN LA ESQUINA SUPERIOR IZQUIERDA */
        .top-banner {
            position: absolute; top: 30px; left: 40px;
            display: flex; flex-direction: column; align-items: flex-start;
            z-index: 20; animation: bannerFadeIn 1s ease-out;
        }
        .banner-logo { font-size: 1.5rem; letter-spacing: 4px; font-weight: 300; text-transform: uppercase; color: #fff; }
        .banner-sub { color: #00d4ff; font-size: 0.6rem; font-weight: bold; letter-spacing: 2px; }

        @keyframes bannerFadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        /* 5. PANEL DE CRISTAL CON BORDE FLUORESCENTE AZUL (Glow) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; padding: 45px;
            max-width: 800px; width: 90%; text-align: center;
            
            /* **TU SOLICITUD DE BORDE Y GLOW AQUÍ** */
            border: 2px solid #00d4ff; /* Borde cian intenso */
            box-shadow: 0 0 35px rgba(0, 212, 255, 0.6); /* Glow azul neón */
            
            animation: panelFadeIn 1s ease-out;
        }

        @keyframes panelFadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.8rem; letter-spacing: 5px; margin: 0 0 5px 0; font-weight: 300; text-transform: uppercase; }
        
        .status-bar { 
            color: #fff; font-size: 0.8rem; margin-bottom: 35px; 
            font-weight: bold; letter-spacing: 2px;
        }
        #blink { color: #00d4ff; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff; transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        #clock { 
            font-size: 2.8rem; font-weight: bold; 
            font-family: 'Courier New', monospace; margin: 5px 0;
        }
        #date { font-size: 0.9rem; color: #00d4ff; font-weight: bold; }

        .btn-login {
            background: transparent; border: 2px solid #00d4ff;
            color: #00d4ff; padding: 12px 25px; border-radius: 6px;
            text-decoration: none; font-weight: bold; margin-top: 15px;
            transition: all 0.3s ease; text-transform: uppercase;
            font-size: 0.8rem; letter-spacing: 1px;
        }

        .btn-login:hover {
            background: #00d4ff; color: #000;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
        }
        
        .tag { font-size: 0.65rem; opacity: 0.7; margin-top: 10px; border: 1px solid rgba(0,212,255,0.4); padding: 2px 8px; border-radius: 4px; }

    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="top-banner">
        <div class="banner-logo">ANDES TECH LAB</div>
        <div class="banner-sub">● SECURE CLOUD INFRASTRUCTURE</div>
    </div>

    <div class="container">
        <div class="glass-panel">
            <h1>Command Center</h1>
            <div class="status-bar">IT OPERATIONS NODE</div>

            <div class="menu-grid">
                <div class="card">
                    <div id="date">CARGANDO...</div>
                    <div id="clock">00:00:00</div>
                    <div class="tag">SANTIAGO, CL (LOCAL TIME)</div>
                </div>

                <div class="card">
                    <h3 style="margin:0; font-weight: 400;">AZURE GATEWAY</h3>
                    <p style="font-size: 0.8rem; color: #ccc; margin: 15px 0;">Acceso administrativo Microsoft Entra ID.</p>
                    <a href="https://portal.azure.com/?whr=andestechlab.onmicrosoft.com" target="_blank" class="btn-login">Iniciar Sesión</a>
                    <div class="tag">SSO / MFA PROTECTED</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('es-CL', options).toUpperCase();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-CL');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
